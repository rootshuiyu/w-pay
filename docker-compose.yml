# N逼pay 本地开发环境 — PostgreSQL 16 + Redis 7
services:
  postgres:
    image: postgres:16-alpine
    container_name: wpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wpay
      POSTGRES_PASSWORD: wpay123
      POSTGRES_DB: wpay
    ports:
      - "5432:5432"
    volumes:
      - wpay_pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpay -d wpay"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: wpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wpay_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  wpay_pg_data:
  wpay_redis_data:
